<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Spots — date ideas around Addis Ababa</title>
    <meta
      name="description"
      content="Curated date spots around Addis Ababa, sourced from the TikTok review channels of people who actually went. Find a place, see where it is and what it costs, and keep a log of where you've been."
    />
    <meta name="theme-color" content="#fbf9f4" />
    <meta name="color-scheme" content="light" />

    <!-- icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="alternate icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Spots" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph / Twitter. NOTE: when you deploy, set OG_ABSOLUTE_URL by
         prefixing og:url and og:image with your real origin (scrapers need
         absolute URLs), e.g. https://yourapp.com/og.png -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spots" />
    <meta property="og:title" content="Spots — date ideas around Addis Ababa" />
    <meta
      property="og:description"
      content="Curated date spots around Addis Ababa, from the people who actually went."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Spots — date ideas around Addis Ababa" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spots — date ideas around Addis Ababa" />
    <meta
      name="twitter:description"
      content="Curated date spots around Addis Ababa, from the people who actually went."
    />
    <meta name="twitter:image" content="/og.png" />

    <!-- Self-hosted variable font (declared in styles.css); preload starts the
         download alongside the HTML instead of after a CSS discovery chain. -->
    <link
      rel="preload"
      href="/fonts/quicksand-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script
      src="https://www.getshiplog.site/widget.js"
      data-widget-id="88b2d3ba-1dc4-41e3-b0ef-a37d3d4872fc"
      async
    ></script>
    <!-- Start the spots query during HTML parse, in parallel with the JS
         bundle download; fetchSpots() (lib/supabase.ts) consumes the promise.
         Keep URL/headers in sync with that file. %VITE_*% is inlined by Vite. -->
    <script>
      // Declared up here on purpose: the helpers below are hoisted and get called
      // from inside the block that follows, but a `var` assignment further down
      // would still be undefined at that point — which silently reads key
      // "undefined" and makes the learned row count look absent.
      var SPOT_COUNT_KEY = "spots:count";

      // Signed-in users skip the preload: their supabase-js query carries a JWT
      // (admins see hidden drafts via RLS) that this anon-key fetch lacks.
      try {
        var signedIn = Object.keys(localStorage).some(function (k) {
          return k.indexOf("sb-") === 0 && k.indexOf("-auth-token") > 0;
        });
      } catch (e) {
        var signedIn = false;
      }
      if (!signedIn) {
        var API = "%VITE_SUPABASE_URL%/rest/v1/spots";
        var HEADERS = {
          apikey: "%VITE_SUPABASE_PUBLISHABLE_KEY%",
          authorization: "Bearer %VITE_SUPABASE_PUBLISHABLE_KEY%",
        };
        var json = function (r) {
          if (!r.ok) throw new Error("preload " + r.status);
          return r.json();
        };

        window.__spotsPreload = fetch(API + "?select=*", { headers: HEADERS }).then(json);
        // swallow so an early failure can't surface as unhandled; the consumer
        // re-awaits and falls back to a normal client query
        window.__spotsPreload.catch(function () {});

        // A second, tiny query for the one spot painted first. The deck shows a
        // random spot per load, so the full catalog above can't reveal which
        // cover is the LCP image until all ~130KB of it has arrived — this row
        // is ~1.5KB and unblocks the image roughly a second earlier.
        var deepLink = null;
        try {
          deepLink = new URLSearchParams(window.location.search).get("spot");
        } catch (e) {
          /* no URLSearchParams — fall through to the random pick */
        }
        // The random offset needs a row count, which we don't have yet on the
        // first request of a first visit — so learn it from the offset query's
        // response (`Prefer: count=exact` makes PostgREST report the row total
        // in content-range even for limit=1) and use it next time.
        // Self-correcting as `spots ingest` grows the catalog. The fallback is
        // used until the first response teaches us the real number, and on every
        // load for visitors whose localStorage is blocked.
        var SPOT_COUNT_FALLBACK = 380;
        var firstQuery = deepLink
          ? "?select=*&limit=1&google_place_id=eq." + encodeURIComponent(deepLink)
          : "?select=*&limit=1&offset=" +
            Math.floor(Math.random() * (knownSpotCount() || SPOT_COUNT_FALLBACK));

        window.__spotsFirst = fetch(API + firstQuery, {
          // Count only the unfiltered query: PostgREST counts the rows the
          // filter matched, so asking on a deep link reports `0-0/1` and would
          // teach a catalog of one. New object either way — HEADERS is shared
          // with the catalog fetch above.
          headers: deepLink ? HEADERS : Object.assign({ prefer: "count=exact" }, HEADERS),
        })
          .then(function (r) {
            // Learn the total *before* the ok check: an offset past the end is a
            // 416, which still carries `content-range: */386`. Skipping it there
            // would leave a stale-high count overshooting on every future load
            // instead of self-correcting on the next one.
            if (!deepLink) rememberSpotCount(r.headers.get("content-range"));
            if (!r.ok) throw new Error("preload " + r.status);
            return r.json();
          })
          .then(function (rows) {
            // Empty means the deep-linked id no longer resolves — deleted, or
            // hidden from anon by RLS. (An overshot offset can't land here: with
            // count=exact it's a 416, which throws above.) Falls back to the
            // catalog.
            var spot = rows && rows[0];
            if (spot && spot.cover_image_url) preloadCover(spot);
            return spot || null;
          });
        window.__spotsFirst.catch(function () {});
      }

      // Row count learned from a previous visit, or 0 when we've never seen one.
      function knownSpotCount() {
        try {
          // Bounded above as well as below: everything this writes is a real row
          // total, but a hand-edited value near 1e21 would produce an offset
          // PostgREST rejects with a 400 — and a 400 carries no content-range, so
          // the usual "the response corrects the count" recovery never fires.
          var n = parseInt(localStorage.getItem(SPOT_COUNT_KEY), 10);
          return n > 0 && n < 1e6 ? n : 0;
        } catch (e) {
          return 0; // storage blocked — the fallback constant applies
        }
      }

      /** Store the total from a PostgREST `content-range: 0-0/386` header. */
      function rememberSpotCount(range) {
        try {
          var total = parseInt(String(range).split("/")[1], 10);
          if (total > 0) localStorage.setItem(SPOT_COUNT_KEY, String(total));
        } catch (e) {
          /* never let bookkeeping break the page */
        }
      }

      // Warm the LCP cover before React exists. Attributes must match the <img>
      // in components/SpotCard.tsx exactly (same srcset, same sizes, no
      // crossorigin) or the browser fetches the image twice instead of reusing
      // this one. Variant naming mirrors coverSrcSet() in lib/format.ts and
      // COVER_VARIANT_WIDTHS in the CLI's lib/storage.ts.
      function preloadCover(spot) {
        try {
          var bucket = "%VITE_SUPABASE_URL%/storage/v1/object/public/spot-covers/";
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          // Deliberately NOT fetchpriority=high. The cover competes with the JS
          // bundle for bandwidth, and until the bundle runs there is nothing to
          // paint the image into: measured ~285ms *worse* LCP with high priority
          // on a bundle-bound connection. The <img> keeps its own high priority,
          // which is what matters once the render is close.
          // Variants exist only for covers re-hosted into our own bucket.
          if (spot.cover_image_url.indexOf(bucket) === 0) {
            var stem = bucket + encodeURIComponent(spot.google_place_id);
            link.setAttribute("imagesrcset", stem + "-480.webp 480w, " + stem + "-960.webp 960w");
            link.setAttribute("imagesizes", "(max-width: 900px) 100vw, 330px");
          }
          link.href = spot.cover_image_url;
          document.head.appendChild(link);
        } catch (e) {
          /* preload is an optimisation; never let it break the page */
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
